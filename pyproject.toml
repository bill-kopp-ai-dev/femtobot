[project]
name = "femtobot"
version = "0.1.0a0+ui0"
description = "A lightweight, CLI-first AI agent foundation for multi-agent systems"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Bill Kopp"},
]
maintainers = [
    {name = "Bill Kopp"},
]
keywords = [
    "ai",
    "agent",
    "cli",
    "llm",
    "multi-agent",
    "a2a",
    "mcp",
    "openai-compatible",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license-files = ["LICENSE"]

dependencies = [
    # CLI framework
    "typer>=0.20.0,<1.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",

    # Data models and configuration
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",

    # WebSocket and HTTP
    "websockets>=16.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "aiohttp>=3.9.0,<4.0.0",

    # Web tools
    "ddgs>=9.5.5,<10.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "olostep>=0.1.0",

    # Logging and UI
    "loguru>=0.7.3,<1.0.0",
    "rich>=14.0.0,<15.0.0",


    # MCP protocol support
    "mcp>=1.26.0,<2.0.0",

    # Data processing
    "json-repair>=0.57.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",

    # Document processing
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "pymupdf>=1.25.0",

    # LLM provider (OpenAI-compatible)
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",

    # Templates
    "jinja2>=3.1.0,<4.0.0",

    # Utilities
    "filelock>=3.25.2",
    "dulwich>=0.22.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",

    # CLI enhancements (Camada 2)
    "watchdog>=5.0.0",  # hot-reload of keybindings.json

    # Femtobot 1.0: PydanticAI agent framework + Logfire observability
    "pydantic-ai>=1.0,<2.0",
    "logfire>=3.14.1,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/bill-kopp-ai-dev/femtobot"
Repository = "https://github.com/bill-kopp-ai-dev/femtobot"
Issues = "https://github.com/bill-kopp-ai-dev/femtobot/issues"

[project.optional-dependencies]
tui = [
    "textual>=0.50.0",
]
pdf = [
    "pymupdf>=1.25.0",
]
# D1 (REFACTOR_PLAN.md Lote D): AWS Bedrock support is gated behind
# an optional extra so a vanilla install doesn't pull in ``boto3``.
bedrock = [
    "boto3>=1.34.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
femtobot = "femtobot.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "femtobot/**/*.py",
    "femtobot/templates/**/*.md",
]
exclude = [
    "femtobot/templates/.gitkeep",
]

[tool.hatch.build.targets.wheel]
packages = ["femtobot"]

[tool.hatch.build.targets.wheel.sources]
"femtobot" = "femtobot"

[tool.hatch.build.targets.sdist]
include = [
    "femtobot/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",  # line too long
    "F841",  # local variable assigned but never used (common in CLI side-effect code)
    "E731",  # lambda assignment (acceptable for trivial callbacks)
    "N806",  # non-lowercase variable in function (allow UPPER_CASE constants in fns)
    "N818",  # exception name should end with Error (legacy: FileSizeExceeded is public API)
    "E402",  # module-level imports not at top (used for back-compat re-exports)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "security: security regression tests (Lote A in REFACTOR_PLAN.md).",
    "durability: durability / concurrency regression tests (Lote B in REFACTOR_PLAN.md).",
    "architecture: architecture / plugin tests (Lote C in REFACTOR_PLAN.md).",
    "providers: provider / proxy tests (Lote D in REFACTOR_PLAN.md).",
    "e2e: end-to-end smoke tests that may hit a real provider (run nightly).",
    "audit: AGENTS.md / SOUL.md static contradiction audit (PR 5.1).",
]
filterwarnings = [
    "error::RuntimeWarning",
]

[tool.coverage.run]
source = ["femtobot"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
